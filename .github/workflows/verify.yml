name: Strict release verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LEBANON_FUEL_LOCAL_STORAGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt 'pytest>=8,<10'
      - name: Bind source and model identities to this exact commit
        env:
          PYTHONPATH: src
        run: python -m lebanon_fuel.automation.release create --base-commit "$GITHUB_SHA"
      - name: Restore exact frozen design input
        env:
          PYTHONPATH: src
        run: python -m lebanon_fuel.automation.release prepare-design
      - name: Restore published data and captures
        env:
          PYTHONPATH: src
        run: python -m lebanon_fuel.automation.publication hydrate
      - name: Verify strictly
        env:
          PYTHONPATH: src
        run: python scripts/verify_production.py
      - name: Preserve verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: |
            reports/releases/current.json
            reports/operations/final_verification.json
            reports/trust_phase1/
