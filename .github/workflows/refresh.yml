name: Refresh Lebanon Fuel Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bounded data & forecast refresh
        env:
          PYTHONPATH: src
        run: |
          python -m lebanon_fuel.automation.cli --root . run || true

      - name: Commit updated databases and exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lebanon_fuel.sqlite data/forecast_ledger.sqlite data/operations.sqlite data/exports/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "chore: scheduled 6h fuel data refresh"
            git push
          else
            echo "No new observations to commit."
          fi
