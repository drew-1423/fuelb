name: Refresh Lebanon Fuel Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Source to refresh
        type: choice
        default: all
        options: [all, ipt, ministry, taqtek, eia, ec, fed]

permissions:
  contents: write

concurrency:
  group: fuel-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Attest current source and frozen models
        env:
          PYTHONPATH: src
        run: python -m lebanon_fuel.automation.release create --base-commit "$GITHUB_SHA"

      - name: Run bounded data & forecast refresh
        id: collect
        continue-on-error: true
        env:
          PYTHONPATH: src
          REFRESH_SOURCE: ${{ inputs.source || 'all' }}
        run: |
          if [ "$REFRESH_SOURCE" = "all" ]; then
            python -m lebanon_fuel.automation.cli --root . run
          else
            python -m lebanon_fuel.automation.cli --root . run --source "$REFRESH_SOURCE"
          fi

      - name: Verify operations integrity
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m lebanon_fuel.automation.cli --root . audit

      - name: Commit updated databases and exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Keep captures and their database references in the same commit,
          # including partial collections that the strict audit rejects.
          git add data/raw/ data/lebanon_fuel.sqlite data/forecast_ledger.sqlite data/operations.sqlite data/exports/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "chore: scheduled 6h fuel data refresh"
            git push
          else
            echo "No new observations to commit."
          fi

      - name: Report collection or integrity failure
        if: always() && (steps.collect.outcome == 'failure' || steps.audit.outcome == 'failure')
        run: |
          echo "Collection or strict integrity audit failed; inspect the preserved reports and captures."
          exit 1
