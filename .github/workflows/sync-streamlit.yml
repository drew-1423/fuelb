name: Sync public Streamlit deployment
on:
  push:
    branches: [main]
  schedule:
    # Refresh commits made with GITHUB_TOKEN do not trigger push workflows.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-streamlit-deployment
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy the current tree without importing main history
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          branch=refs/heads/codex/cloud-clean
          git fetch --no-tags --depth=1 origin "$branch"
          deployed=$(git rev-parse FETCH_HEAD)
          # Verification hashes the workflow files too. Deploy the exact tree.
          tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$tree" = "$(git rev-parse "$deployed^{tree}")" ]; then
            echo "Streamlit already has the current app files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          revision=$(git commit-tree "$tree" -p "$deployed" -m "Deploy $(git rev-parse --short HEAD) to Streamlit")
          git push origin "$revision:$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.sync.outputs.changed == 'true'
        with:
          python-version: '3.13'
      - name: Prepare browser snapshot verification
        if: steps.sync.outputs.changed == 'true'
        run: |
          python -m pip install 'playwright>=1.51,<2'
          python -m playwright install --with-deps chromium
      - name: Verify snapshot loaded on the public app
        if: steps.sync.outputs.changed == 'true'
        run: python scripts/check_public_snapshot.py
